<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
<title>MUSIC ELEVATOR</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;420;500&family=Inter:wght@300;400;480;520;600;700;800;900&display=swap');

  @property --breathe-alpha {
    syntax: '<number>';
    inherits: false;
    initial-value: 0;
  }

  :root {
    --p1: oklch(0.85 0.14 80);
    --p2: oklch(0.80 0.16 78);
    --p3: oklch(0.76 0.17 76);
    --p4: oklch(0.73 0.18 75);
    --off: #F7F7F7;
    --mid: #9A9A9A;
    --rule: #2A2A2A;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    position: relative;
    background: linear-gradient(to bottom, #1a1a1a 0%, #0D0D0D 140%);
    min-height: 100%;
    color: var(--off);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    line-height: 1.4;
  }
  /* RIPPLE + DEPTH — layer 0: combined rings over depth gradient */
  html::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      radial-gradient(
        ellipse 50% 50% at 50% 50%,
        rgba(255, 255, 255, 0.050)  0%,
        rgba(255, 255, 255, 0.000)  9%,
        rgba(255, 255, 255, 0.042) 18%,
        rgba(255, 255, 255, 0.000) 27%,
        rgba(255, 255, 255, 0.035) 35%,
        rgba(255, 255, 255, 0.000) 45%,
        rgba(255, 255, 255, 0.028) 53%,
        rgba(255, 255, 255, 0.000) 62%,
        rgba(255, 255, 255, 0.020) 70%,
        rgba(255, 255, 255, 0.000) 80%,
        rgba(255, 255, 255, 0.014) 88%,
        rgba(255, 255, 255, 0.000) 100%
      ),
      linear-gradient(
        to bottom,
        #0D0D0D  0%,
        #060A0D  3%,
        #11161A  8%,
        #0D1115 18%,
        #080D10 30%,
        #030507 48%,
        #010304 92%,
        #0D0D0D 100%
      );
    background-repeat: no-repeat, no-repeat;
    background-size: 200vw 60vh, 100% 100%;
    background-position: 50% 60px, 0 0;
    background-blend-mode: screen, normal;
    animation: ripple-pulse 14s ease-in-out infinite;
  }
  @keyframes ripple-pulse {
    0%, 100% { background-size: 200vw 60vh, 100% 100%; }
    50%      { background-size: 207vw 60vh, 100% 100%; }
  }

  body {
    position: relative;
    background: transparent;
    min-height: 100vh;
    overflow-x: hidden;
  }
  /* GREEN MURK — layer 2: murky green floats */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background:
      radial-gradient(ellipse 120%% 80%% at 70%% 60%%,
        oklch(0.35 0.08 155 / 0.09) 0%%, oklch(0.25 0.06 160 / 0.05) 40%%, rgba(0,0,0,0) 100%%),
      radial-gradient(ellipse 140%% 90%% at 30%% 30%%,
        oklch(0.30 0.10 145 / 0.10) 0%%, oklch(0.22 0.07 150 / 0.06) 35%%, rgba(0,0,0,0) 100%%),
      radial-gradient(ellipse 100%% 100%% at 50%% 50%%,
        oklch(0.28 0.08 155 / var(--breathe-alpha,0)) 0%%, rgba(0,0,0,0) 100%%);
    background-size: 280%% 280%%, 280%% 280%%, 100%% 100%%;
    background-position: 20%% 10%%, 20%% 10%%, 50%% 50%%;
    animation:
      drift-a 104s ease-in-out infinite,
      drift-b 74s  ease-in-out infinite -28s,
      breathe 180s ease-in-out infinite;
  }
  @keyframes drift-a {
    0%%   { background-position: 20%% 10%%, 20%% 10%%, 50%% 50%%; }
    25%%  { background-position: 65%% 35%%, 65%% 35%%, 50%% 50%%; }
    55%%  { background-position: 40%% 75%%, 40%% 75%%, 50%% 50%%; }
    78%%  { background-position: 15%% 55%%, 15%% 55%%, 50%% 50%%; }
    100%% { background-position: 20%% 10%%, 20%% 10%%, 50%% 50%%; }
  }
  @keyframes drift-b {
    0%%   { background-position: 20%% 10%%, 80%% 20%%, 50%% 50%%; }
    30%%  { background-position: 20%% 10%%, 30%% 65%%, 50%% 50%%; }
    60%%  { background-position: 20%% 10%%, 70%% 90%%, 50%% 50%%; }
    100%% { background-position: 20%% 10%%, 80%% 20%%, 50%% 50%%; }
  }
  @keyframes breathe {
    0%%, 100%% { --breathe-alpha: 0; }
    40%%        { --breathe-alpha: 0.06; }
  }

  /* BLUE DEPTH — layer 3: darkening toward bottom with blue depth */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background:
      linear-gradient(
        to bottom,
        transparent 0%%,
        oklch(0.12 0.04 240 / 0.15) 40%%,
        oklch(0.08 0.06 235 / 0.35) 65%%,
        oklch(0.05 0.07 230 / 0.55) 85%%,
        oklch(0.03 0.08 225 / 0.70) 100%%
      ),
      radial-gradient(ellipse 100%% 100%% at 50%% 50%%,
        rgba(0,0,0,0) 40%%, oklch(0.05 0.05 230 / 0.25) 100%%),
      radial-gradient(ellipse 130%% 80%% at 60%% 80%%,
        oklch(0.08 0.06 220 / 0.20) 0%%, transparent 60%%);
  }

  /* SVG ORNAMENT — murky 180° float, right side */

  /* FIGURE 8 — bottom right watermark */
  .statue-wrap {
    position: fixed;
    bottom: 28px;
    right: 28px;
    z-index: 2;
    pointer-events: auto;
    cursor: pointer;
    opacity: 0.08;
    transition: transform 0.4s ease, opacity 0.4s ease, filter 0.3s ease;
  }
  .statue-wrap:hover {
    transform: scale(1.15);
    opacity: 0.14;
    filter: url(#fe-turb);
    animation: wm-jiggle 0.3s ease infinite;
  }

  /* BUBBLES — layer 1 */
  .bubble-field {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    -webkit-mask-image: linear-gradient(
      to bottom,
      transparent 4%%,
      black 16%%,
      black 84%%,
      transparent 96%%
    );
    mask-image: linear-gradient(
      to bottom,
      transparent 4%%,
      black 16%%,
      black 84%%,
      transparent 96%%
    );
  }
  .bubble-field svg {
    display: block;
    width: 100%%;
    height: 100%%;
    overflow: visible;
  }

  .wrap {
    position: relative;
    z-index: 5;
    max-width: 700px;
    margin: 64px auto 0;
    padding: 0 0 100px;
  }

  header {
    padding: 0 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-bottom: 40px;
  }

  .masthead {
    margin-bottom: 8px;
    width: 100%;
  }
  .cover-heading {
    display: block;
    width: 100%;
    height: auto;
  }
  .cover-heading path { fill: var(--off); }

  /* SEARCH INPUT */
  .hunt-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 28px;
    margin-bottom: 36px;
  }
  .hunt-input-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 4px;
    height: 56px;
    padding: 0 12px;
    background: #1e1e1e;
    border: none;
    border-bottom: 1px solid var(--rule);
  }
  .hunt-input-wrap svg {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    color: #F7F7F7;
  }
  .hunt-input-wrap input {
    flex: 1;
    height: 100%;
    background: none;
    border: none;
    outline: none;
    font-family: 'Inter', sans-serif;
    font-size: 18px;
    font-weight: 450;
    color: #F7F7F7;
  }
  .hunt-input-wrap input::placeholder {
    color: #F7F7F7;
    opacity: 0.4;
  }
  .hunt-btn {
    width: 165px;
    height: 56px;
    border-radius: 4px;
    background: #73D7E5;
    border: none;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: #0D0D0D;
    letter-spacing: 0.02em;
    transition: opacity 0.15s;
    flex-shrink: 0;
  }
  .hunt-btn:hover { opacity: 0.85; }
  .hunt-btn:disabled { opacity: 0.5; cursor: wait; }
  .hunt-btn.loading { animation: pulse-btn 1s ease-in-out infinite; }
  @keyframes pulse-btn {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 0.7; }
  }

  .era-header { padding: 36px 28px 0; }
  .era-header-inner {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--era-color, var(--p2));
  }
  .era-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .era-more-btn {
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px;
    background: none; border: none; cursor: pointer;
    padding: 0;
    opacity: 0.7;
    transition: opacity 0.12s;
  }
  .era-more-btn svg { width: 30px; height: 22px; }
  .era-more-btn:hover { opacity: 1; }
  .era-more-btn:hover .more-rest { display: none; }
  .era-more-btn:hover .more-hover { display: block; }
  .era-more-btn .more-hover { display: none; width: 32px; height: 32px; }
  .era-more-btn:disabled { opacity: 0.4; cursor: wait; }
  .era-more-btn .loader {
    width: 26px; height: 26px;
    display: inline-block; position: relative;
  }
  .era-more-btn .loader::after,
  .era-more-btn .loader::before {
    content: '';
    box-sizing: border-box;
    width: 26px; height: 26px;
    border: 2px solid #FFF;
    position: absolute;
    left: 0; top: 0;
    animation: scaleOut 2s ease-in-out infinite;
  }
  .era-more-btn .loader::after {
    border-color: #FA5ABE;
    animation-delay: 1s;
  }
  @keyframes scaleOut {
    0% { transform: scale(0); }
    100% { transform: scale(1); }
  }
  .era-trash-btn {
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px;
    color: var(--mid); background: none; border: none;
    padding: 0; cursor: pointer;
    transition: color 0.12s;
  }
  .era-trash-btn svg { width: 28px; height: 28px; }
  .era-trash-btn:hover { color: oklch(0.65 0.22 360); }

  [data-era="1"] { --era-color: oklch(0.78 0.14 180); }
  [data-era="2"] { --era-color: oklch(0.85 0.18 80); }
  [data-era="ai"] { --era-color: #73D7E5; }
  .era-title {
    font-family: 'Inter', sans-serif; font-weight: 600;
    font-size: 15px; line-height: 16px;
    letter-spacing: 0.04em; text-transform: uppercase; color: var(--off);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    min-width: 0;
  }
  .era-years {
    font-family: 'Inter', sans-serif; font-weight: 520;
    font-size: 15px; letter-spacing: 0.02em;
    color: var(--off); opacity: 0.6; white-space: nowrap;
  }

  section { padding: 0 28px; }

  .section-head {
    display: flex; align-items: baseline; gap: 12px;
    padding: 28px 0 12px; position: relative;
  }
  .section-label {
    font-family: 'Inter', sans-serif; font-weight: 480;
    font-size: 17px; line-height: 1; letter-spacing: 0.02em; color: var(--off);
  }
  .section-note {
    font-family: 'Inter', sans-serif; font-weight: 600;
    font-size: 15px; line-height: 1;
    letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--p1); opacity: 0.45;
  }

  .track {
    display: grid; grid-template-columns: 28px 1fr auto auto auto; column-gap: 20px;
    align-items: center; gap: 10px 16px;
    padding: 11px 0; border-bottom: 1px solid #1C1C1C; position: relative;
    cursor: pointer;
  }
  .track:hover {
    background: none;
  }
  .track-num {
    font-family: 'JetBrains Mono', monospace; font-weight: 500;
    font-size: 17px; line-height: 1;
    letter-spacing: 0.02em; text-transform: uppercase;
    color: var(--era-color, var(--p2)); text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .track-info { min-width: 0; }
  .track-title {
    font-family: 'Inter', sans-serif; font-weight: 480;
    font-size: 17px; line-height: 16px;
    letter-spacing: 0.02em; color: var(--off);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .track-artist {
    font-family: 'Inter', sans-serif; font-weight: 600;
    font-size: 15px; line-height: 16px;
    letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--mid); margin-top: 5px;
  }

  .copy-btn, .play-btn, .trash-btn {
    display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px;
    color: var(--mid); background: none; border: none;
    padding: 0; cursor: pointer;
    transition: color 0.12s ease; flex-shrink: 0;
  }
  .copy-btn svg, .play-btn svg, .trash-btn svg { width: 28px; height: 28px; }
  .copy-btn:hover { color: oklch(0.82 0.16 80); }
  .copy-btn.active { color: oklch(0.82 0.18 78); }
  .play-btn:hover { color: oklch(0.82 0.14 200); }
  .play-btn.active { color: oklch(0.78 0.16 195); }
  .trash-btn:hover { color: oklch(0.65 0.22 360); }
  .trash-btn.active { color: oklch(0.62 0.25 355); }

  footer { padding: 52px 28px 0; display: flex; align-items: center; gap: 16px; }
  .footer-line { flex: 1; height: 1px; background: var(--rule); }
  .footer-txt {
    font-family: 'Inter', sans-serif;
    font-size: 15px; font-weight: 520;
    letter-spacing: 0.02em; text-transform: uppercase; color: #383838;
  }

  .watermark, .watermark-tr, .watermark-tl {
    position: fixed;
    opacity: 0.08; pointer-events: auto; z-index: 2;
    cursor: pointer;
    transition: transform 0.4s ease, opacity 0.4s ease, filter 0.3s ease;
  }
  .watermark { bottom: 28px; left: 28px; }
  .watermark-tr { top: 28px; right: 28px; }
  .watermark-tl { top: 28px; left: 28px; }
  .watermark:hover, .watermark-tr:hover, .watermark-tl:hover {
    transform: scale(1.15);
    opacity: 0.14;
    filter: url(#fe-turb);
    animation: wm-jiggle 0.3s ease infinite;
  }
  @keyframes wm-jiggle {
    0%, 100% { translate: 0 0; }
    25% { translate: 2px -1px; }
    50% { translate: -1px 2px; }
    75% { translate: 1px -2px; }
  }

  #toast {
    position: fixed; bottom: 24px; left: 50%%;
    transform: translateX(-50%%) translateY(12px);
    background: var(--p1); color: #080808;
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px; font-weight: 520;
    letter-spacing: 0.02em; text-transform: uppercase;
    padding: 8px 18px; opacity: 0;
    transition: opacity 0.15s, transform 0.15s;
    pointer-events: none; z-index: 100;
    clip-path: polygon(0 0, calc(100%% - 6px) 0, 100%% 6px, 100%% 100%%, 6px 100%%, 0 calc(100%% - 6px));
  }
  #toast.show { opacity: 1; transform: translateX(-50%%) translateY(0); }
</style>
</head>
<body>



<!-- DIAMOND: bottom right watermark, vertical lines -->
<svg class="statue-wrap" width="300" height="300" viewBox="0 0 180 180" aria-hidden="true">
  <defs><clipPath id="diamond"><polygon points="90,2 178,90 90,178 2,90"/></clipPath></defs>
  <g clip-path="url(#diamond)">
    <line x1="10"  y1="0" x2="10"  y2="180" stroke="white" stroke-width="2.5"/>
    <line x1="30"  y1="0" x2="30"  y2="180" stroke="white" stroke-width="2.5"/>
    <line x1="50"  y1="0" x2="50"  y2="180" stroke="white" stroke-width="2.5"/>
    <line x1="70"  y1="0" x2="70"  y2="180" stroke="white" stroke-width="2.5"/>
    <line x1="90"  y1="0" x2="90"  y2="180" stroke="white" stroke-width="2.5"/>
    <line x1="110" y1="0" x2="110" y2="180" stroke="white" stroke-width="2.5"/>
    <line x1="130" y1="0" x2="130" y2="180" stroke="white" stroke-width="2.5"/>
    <line x1="150" y1="0" x2="150" y2="180" stroke="white" stroke-width="2.5"/>
    <line x1="170" y1="0" x2="170" y2="180" stroke="white" stroke-width="2.5"/>
  </g>
</svg>

<!-- BUBBLE FIELD -->
<div class="bubble-field" aria-hidden="true">
  <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
    <defs>
      <linearGradient id="bub-base" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
        <stop offset="0%"   stop-color="#3DAF8C" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#1A7A5A" stop-opacity="0.08"/>
      </linearGradient>
      <filter id="bub-inset"
        x="-20%" y="-20%" width="140%" height="140%"
        filterUnits="objectBoundingBox"
        primitiveUnits="objectBoundingBox"
        color-interpolation-filters="sRGB">
        <feOffset in="SourceAlpha" dx="0" dy="0.10" result="shifted"/>
        <feGaussianBlur in="shifted" stdDeviation="0.10" result="blurred"/>
        <feComposite in="blurred" in2="SourceAlpha" operator="in" result="clipped"/>
        <feFlood flood-color="white" flood-opacity="0.22" result="hiColor"/>
        <feComposite in="hiColor" in2="clipped" operator="in" result="hi"/>
        <feMerge>
          <feMergeNode in="SourceGraphic"/>
          <feMergeNode in="hi"/>
        </feMerge>
      </filter>
      <symbol id="bub" viewBox="-0.5 -0.5 1 1">
        <g filter="url(#bub-inset)">
          <circle cx="0" cy="0" r="0.5" fill="url(#bub-base)"/>
          <circle cx="0" cy="0" r="0.5" fill="white" fill-opacity="0.18" style="mix-blend-mode:overlay"/>
        </g>
      </symbol>
    </defs>
    <!-- band 1 — sparse top -->
    <use href="#bub" x="6%"  y="8%"  width="28" height="28" opacity="0.11"/>
    <use href="#bub" x="31%" y="6%"  width="18" height="18" opacity="0.09"/>
    <use href="#bub" x="58%" y="9%"  width="36" height="36" opacity="0.10"/>
    <use href="#bub" x="82%" y="7%"  width="22" height="22" opacity="0.08"/>
    <!-- band 2 -->
    <use href="#bub" x="14%" y="20%" width="44" height="44" opacity="0.13"/>
    <use href="#bub" x="36%" y="18%" width="28" height="28" opacity="0.12"/>
    <use href="#bub" x="63%" y="21%" width="20" height="20" opacity="0.10"/>
    <use href="#bub" x="88%" y="19%" width="38" height="38" opacity="0.11"/>
    <!-- band 3 -->
    <use href="#bub" x="4%"  y="34%" width="32" height="32" opacity="0.14"/>
    <use href="#bub" x="22%" y="36%" width="48" height="48" opacity="0.14"/>
    <use href="#bub" x="44%" y="33%" width="24" height="24" opacity="0.12"/>
    <use href="#bub" x="69%" y="35%" width="40" height="40" opacity="0.13"/>
    <use href="#bub" x="91%" y="34%" width="26" height="26" opacity="0.10"/>
    <!-- band 4 -->
    <use href="#bub" x="10%" y="50%" width="36" height="36" opacity="0.13"/>
    <use href="#bub" x="30%" y="52%" width="22" height="22" opacity="0.11"/>
    <use href="#bub" x="52%" y="49%" width="50" height="50" opacity="0.12"/>
    <use href="#bub" x="77%" y="51%" width="30" height="30" opacity="0.12"/>
    <!-- band 5 -->
    <use href="#bub" x="18%" y="65%" width="42" height="42" opacity="0.11"/>
    <use href="#bub" x="40%" y="67%" width="28" height="28" opacity="0.10"/>
    <use href="#bub" x="62%" y="64%" width="36" height="36" opacity="0.11"/>
    <use href="#bub" x="86%" y="66%" width="20" height="20" opacity="0.09"/>
    <!-- band 6 — sparse lower -->
    <use href="#bub" x="7%"  y="78%" width="24" height="24" opacity="0.07"/>
    <use href="#bub" x="27%" y="80%" width="38" height="38" opacity="0.06"/>
    <use href="#bub" x="55%" y="77%" width="28" height="28" opacity="0.07"/>
    <use href="#bub" x="80%" y="79%" width="44" height="44" opacity="0.06"/>
    <!-- band 7 — very sparse bottom -->
    <use href="#bub" x="15%" y="89%" width="20" height="20" opacity="0.05"/>
    <use href="#bub" x="43%" y="91%" width="32" height="32" opacity="0.04"/>
    <use href="#bub" x="72%" y="88%" width="24" height="24" opacity="0.04"/>
    <use href="#bub" x="90%" y="93%" width="18" height="18" opacity="0.03"/>
  </svg>
</div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="fe-turb">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" seed="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<svg class="watermark" width="300" height="300" viewBox="0 0 180 180">
  <line x1="0"   y1="0"   x2="180" y2="180" stroke="white" stroke-width="2.5"/>
  <line x1="36"  y1="0"   x2="180" y2="144" stroke="white" stroke-width="2.5"/>
  <line x1="72"  y1="0"   x2="180" y2="108" stroke="white" stroke-width="2.5"/>
  <line x1="108" y1="0"   x2="180" y2="72"  stroke="white" stroke-width="2.5"/>
  <line x1="0"   y1="36"  x2="144" y2="180" stroke="white" stroke-width="2.5"/>
  <line x1="0"   y1="72"  x2="108" y2="180" stroke="white" stroke-width="2.5"/>
  <line x1="0"   y1="108" x2="72"  y2="180" stroke="white" stroke-width="2.5"/>
</svg>

<svg class="watermark-tr" width="300" height="300" viewBox="0 0 180 180">
  <!-- Circle made of horizontal lines, clipped to circle — AT&T style -->
  <defs><clipPath id="circ"><circle cx="90" cy="90" r="88"/></clipPath></defs>
  <g clip-path="url(#circ)">
    <line x1="0" y1="10"  x2="180" y2="10"  stroke="white" stroke-width="2.5"/>
    <line x1="0" y1="30"  x2="180" y2="30"  stroke="white" stroke-width="2.5"/>
    <line x1="0" y1="50"  x2="180" y2="50"  stroke="white" stroke-width="2.5"/>

  <!-- Triangle made of left/right orthogonal lines -->
  <defs><clipPath id="tri"><polygon points="90,5 175,170 5,170"/></clipPath></defs>
  <g clip-path="url(#tri)">
    <line x1="0" y1="0"   x2="180" y2="180" stroke="white" stroke-width="2.5"/>

    <line x1="180" y1="0"  x2="0"   y2="180" stroke="white" stroke-width="2.5"/>
    <line x1="150" y1="0"  x2="0"   y2="150" stroke="white" stroke-width="2.5"/>

    <line x1="0"   y1="60" x2="120" y2="180" stroke="white" stroke-width="2.5"/>
    <line x1="30"  y1="180" x2="180" y2="30" stroke="white" stroke-width="2.5"/>
    <line x1="60"  y1="180" x2="180" y2="60" stroke="white" stroke-width="2.5"/>
  </g>
</svg>

<div class="wrap">

  <header>
    <div class="masthead">
      <img class="cover-heading" src="cover.svg" alt="MUSIC SONGS">
    </div>
  </header>

  <div class="hunt-bar">
    <div class="hunt-input-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="hunt-input" placeholder="Describe some music">
    </div>
    <button class="hunt-btn" id="hunt-btn">Hunt</button>
  </div>

  <div id="ai-results"></div>

  <div data-era="1">
  <div class="era-header">
    <div class="era-header-inner">
      <span class="era-title">Freakshow Crooners 20th C.</span>
    </div>
  </div>
  <section><div id="tracks-era1"></div></section>
  </div>

  <div data-era="2">
  <div class="era-header">
    <div class="era-header-inner">
      <span class="era-title">Obnoxious Music to Get Mad About</span>
    </div>
  </div>
  <section><div id="tracks-era2"></div></section>
  </div>

  <footer>
    <div class="footer-line"></div>
    <div class="footer-txt">Going Up?</div>
    <div class="footer-line"></div>
  </footer>
</div>

<div id="toast">Copied</div>

<script>
const DATA = {
  'tracks-era1': [
    { title: "I Heard Your Name", artist: "Martin Rev" },
    { title: "So Hot (Wash Away All of My Tears)", artist: "Spacemen 3" },
    { title: "Surrender", artist: "Suicide" },
    { title: "Unchained Melody", artist: "The Fleetwoods" },
    { title: "Blue Moon - Take 9", artist: "Elvis Presley" },
  ],
  'tracks-era2': [
    { title: "Wrestling Woman", artist: "Shockabilly" },
    { title: "Good Looking Boys or Women", artist: "Country Teasers" },
    { title: "The Day That Lassie Went to the Moon", artist: "Camper Van Beethoven" },
    { title: "The Way I Walk", artist: "The Cramps" },
    { title: "No Aloha", artist: "Breeders" },
  ],
};

let toastTimer;
var ICON_COPY = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 8H10C8.89543 8 8 8.89543 8 10V20C8 21.1046 8.89543 22 10 22H20C21.1046 22 22 21.1046 22 20V10C22 8.89543 21.1046 8 20 8Z"/><path d="M4 16C2.9 16 2 15.1 2 14V4C2 2.9 2.9 2 4 2H14C15.1 2 16 2.9 16 4"/></svg>';
var ICON_COPY_CHECK = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15L14 17L18 13"/><path d="M20 8H10C8.89543 8 8 8.89543 8 10V20C8 21.1046 8.89543 22 10 22H20C21.1046 22 22 21.1046 22 20V10C22 8.89543 21.1046 8 20 8Z"/><path d="M4 16C2.9 16 2 15.1 2 14V4C2 2.9 2.9 2 4 2H14C15.1 2 16 2.9 16 4"/></svg>';
var ICON_PLAY = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5.00059C4.9999 4.64868 5.09265 4.30298 5.26888 3.99838C5.44512 3.69379 5.69861 3.44108 6.00375 3.26579C6.30889 3.09049 6.65488 2.99882 7.00679 3.00001C7.3587 3.00121 7.70406 3.09523 8.008 3.27259L20.005 10.2706C20.3078 10.4463 20.5591 10.6983 20.7339 11.0016C20.9088 11.3049 21.0009 11.6487 21.0012 11.9987C21.0015 12.3488 20.91 12.6928 20.7357 12.9963C20.5614 13.2999 20.3105 13.5524 20.008 13.7286L8.008 20.7286C7.70406 20.906 7.3587 21 7.00679 21.0012C6.65488 21.0024 6.30889 20.9107 6.00375 20.7354C5.69861 20.5601 5.44512 20.3074 5.26888 20.0028C5.09265 19.6982 4.9999 19.3525 5 19.0006V5.00059Z"/></svg>';
var ICON_TRASH = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 11V17"/><path d="M14 11V17"/><path d="M19 6V20C19 20.5304 18.7893 21.0391 18.4142 21.4142C18.0391 21.7893 17.5304 22 17 22H7C6.46957 22 5.96086 21.7893 5.58579 21.4142C5.21071 21.0391 5 20.5304 5 20V6"/><path d="M3 6H21"/><path d="M8 6V4C8 3.46957 8.21071 2.96086 8.58579 2.58579C8.96086 2.21071 9.46957 2 10 2H14C14.5304 2 15.0391 2.21071 15.4142 2.58579C15.7893 2.96086 16 3.46957 16 4V6"/></svg>';

function flash(btn, cls, dur) {
  btn.classList.add(cls);
  setTimeout(function() { btn.classList.remove(cls); }, dur || 500);
}
function copyText(term, btn) {
  var url = 'https://open.spotify.com/search/' + encodeURIComponent(term);
  navigator.clipboard.writeText(url).then(function() {
    btn.innerHTML = ICON_COPY_CHECK;
    flash(btn, 'active', 500);
    setTimeout(function() { btn.innerHTML = ICON_COPY; }, 500);
    var toast = document.getElementById('toast');
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { toast.classList.remove('show'); }, 1600);
  });
}
function playTrack(term, btn) {
  flash(btn, 'active', 500);
  var url = 'https://open.spotify.com/search/' + encodeURIComponent(term);
  window.open(url, '_blank', 'noopener');
}
// Persistence
var DELETED_KEY = 'elevator_deleted';
var DELETED_SECTIONS_KEY = 'elevator_deleted_sections';
var AI_SECTIONS_KEY = 'elevator_ai_sections';

function getDeleted() {
  try { return JSON.parse(localStorage.getItem(DELETED_KEY) || '[]'); } catch(e) { return []; }
}
function addDeleted(key) {
  var d = getDeleted(); d.push(key); localStorage.setItem(DELETED_KEY, JSON.stringify(d));
}
function getDeletedSections() {
  try { return JSON.parse(localStorage.getItem(DELETED_SECTIONS_KEY) || '[]'); } catch(e) { return []; }
}
function addDeletedSection(key) {
  var d = getDeletedSections(); d.push(key); localStorage.setItem(DELETED_SECTIONS_KEY, JSON.stringify(d));
}
function getAiSections() {
  try { return JSON.parse(localStorage.getItem(AI_SECTIONS_KEY) || '[]'); } catch(e) { return []; }
}
function saveAiSections(sections) {
  localStorage.setItem(AI_SECTIONS_KEY, JSON.stringify(sections));
}

function removeTrack(row, btn, trackKey) {
  flash(btn, 'active', 500);
  if (trackKey) addDeleted(trackKey);
  setTimeout(function() {
    row.style.transition = 'opacity 0.3s'; row.style.opacity = '0';
    setTimeout(function() { row.remove(); }, 300);
  }, 500);
}

function removeSection(wrapper) {
  var title = wrapper.querySelector('.era-title');
  if (title) addDeletedSection(title.textContent);
  // also remove from AI sections storage
  var sections = getAiSections();
  sections = sections.filter(function(s) { return s.query !== (title ? title.textContent : ''); });
  saveAiSections(sections);
  wrapper.style.transition = 'opacity 0.3s'; wrapper.style.opacity = '0';
  setTimeout(function() { wrapper.remove(); }, 300);
}

function buildTrackRow(track, i, sectionQuery) {
  var term = track.title + ' ' + track.artist;
  var trackKey = (sectionQuery || '') + '::' + term;
  var row = document.createElement('div');
  row.className = 'track';
  row.innerHTML = '<span class="track-num">' + String(i+1).padStart(2,'0') + '</span><div class="track-info"><div class="track-title">' + track.title + '</div><div class="track-artist">' + track.artist + '</div></div><button class="copy-btn" aria-label="Copy">' + ICON_COPY + '</button><button class="play-btn" aria-label="Play">' + ICON_PLAY + '</button><button class="trash-btn" aria-label="Remove">' + ICON_TRASH + '</button>';
  row.querySelector('.copy-btn').addEventListener('click', function(e) {
    e.stopPropagation(); copyText(term, e.currentTarget);
  });
  row.querySelector('.play-btn').addEventListener('click', function(e) {
    e.stopPropagation(); playTrack(term, e.currentTarget);
  });
  row.querySelector('.trash-btn').addEventListener('click', function(e) {
    e.stopPropagation(); removeTrack(row, e.currentTarget, trackKey);
  });
  return row;
}

function buildAiSection(query, songs) {
  var deleted = getDeleted();
  var wrapper = document.createElement('div');
  wrapper.setAttribute('data-era', 'ai');

  var hdr = document.createElement('div');
  hdr.className = 'era-header';
  hdr.innerHTML = '<div class="era-header-inner"><span class="era-title">' + query + '</span><div class="era-actions"><button class="era-more-btn"><svg class="more-rest" width="30" height="22" viewBox="0 0 30 22" fill="none"><path d="M29.9989 22H16.1133V17.3521H20.4333V5.76338L16.175 6.6V1.85915L25.679 0V17.3521H29.9989V22Z" fill="white"/><path d="M9.44225 8.88226H13.8857V13.5301H9.44225V18.178H4.50513V13.5301H0V8.88226H4.50513V4.23438H9.44225V8.88226Z" fill="white"/></svg><svg class="more-hover" width="44" height="44" viewBox="0 0 44 44" fill="none"><rect width="44" height="44" rx="4" fill="#FA5ABE"/><path d="M36.8466 33H22.9609V28.3521H27.2809V16.7634L23.0227 17.6V12.8592L32.5266 11V28.3521H36.8466V33Z" fill="white"/><path d="M16.2899 19.8823H20.7333V24.5301H16.2899V29.178H11.3528V24.5301H6.84766V19.8823H11.3528V15.2344H16.2899V19.8823Z" fill="white"/></svg></button><button class="era-trash-btn">' + ICON_TRASH + '</button></div></div>';
  wrapper.appendChild(hdr);

  var sec = document.createElement('section');
  sec.style.padding = '0 28px';
  var count = 0;
  songs.forEach(function(song) {
    var term = song.title + ' ' + song.artist;
    var trackKey = query + '::' + term;
    if (deleted.indexOf(trackKey) === -1) {
      sec.appendChild(buildTrackRow(song, count, query));
      count++;
    }
  });
  wrapper.appendChild(sec);

  // section trash
  hdr.querySelector('.era-trash-btn').addEventListener('click', function() {
    removeSection(wrapper);
  });

  // one more
  var moreBtn = hdr.querySelector('.era-more-btn');
  moreBtn.addEventListener('click', function() {
    moreBtn.disabled = true;
    moreBtn._prevHTML = moreBtn.innerHTML;
    moreBtn.innerHTML = '<span class="loader"></span>';
    fetch('/api/recommend', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: query + ' (give me 1 more song, different from: ' + songs.map(function(s) { return s.title; }).join(', ') + ')' })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (!data.songs || !data.songs.length) throw new Error('No results');
      var newSong = data.songs[0];
      songs.push(newSong);
      // persist
      var sections = getAiSections();
      var found = false;
      sections.forEach(function(s) { if (s.query === query) { s.songs = songs; found = true; } });
      if (!found) sections.push({ query: query, songs: songs });
      saveAiSections(sections);
      var idx = sec.querySelectorAll('.track').length;
      sec.appendChild(buildTrackRow(newSong, idx, query));
    })
    .catch(function(err) { alert('Failed: ' + err.message); })
    .finally(function() { moreBtn.disabled = false; moreBtn.innerHTML = moreBtn._prevHTML; });
  });

  return { wrapper: wrapper, songs: songs };
}

// Render hardcoded tracks
var deleted = getDeleted();
var deletedSections = getDeletedSections();

Object.entries(DATA).forEach(function(entry) {
  var id = entry[0]; var tracks = entry[1];
  var container = document.getElementById(id);
  if (!container) return;
  tracks.forEach(function(track, i) {
    var term = track.title + ' ' + track.artist;
    var trackKey = id + '::' + term;
    if (deleted.indexOf(trackKey) !== -1) return;
    var row = buildTrackRow(track, i, id);
    container.appendChild(row);
  });
});

// Restore saved AI sections
var huntInput = document.getElementById('hunt-input');
var huntBtn = document.getElementById('hunt-btn');
var aiResults = document.getElementById('ai-results');

getAiSections().forEach(function(s) {
  if (deletedSections.indexOf(s.query) !== -1) return;
  var built = buildAiSection(s.query, s.songs);
  aiResults.appendChild(built.wrapper);
});

// Gather recent enriched songs for context
function getRecentContext() {
  var sections = getAiSections();
  var all = [];
  sections.forEach(function(s) { s.songs.forEach(function(song) { all.push(song); }); });
  return all.slice(-3);
}

// Hunt
function doHunt() {
  var q = huntInput.value.trim();
  if (!q) return;
  huntBtn.disabled = true;
  huntBtn.classList.add('loading');
  huntBtn.textContent = 'Hunting\u2026';

  fetch('/api/recommend', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ query: q, context: getRecentContext() })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (!data.songs || !data.songs.length) throw new Error('No results');
    var label = data.label || q;
    var built = buildAiSection(label, data.songs);
    // persist
    var sections = getAiSections();
    sections.push({ query: label, songs: data.songs });
    saveAiSections(sections);
    aiResults.prepend(built.wrapper);
    huntInput.value = '';
  })
  .catch(function(err) { alert('Hunt failed: ' + err.message); })
  .finally(function() {
    huntBtn.disabled = false;
    huntBtn.classList.remove('loading');
    huntBtn.textContent = 'Hunt';
  });
}

huntBtn.addEventListener('click', doHunt);
huntInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') doHunt(); });

</script>
</body>
</html>
